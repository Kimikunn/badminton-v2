version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badminton
    restart: unless-stopped
    env_file:
      - server/.env
    ports:
      - "8088:3000"
    volumes:
      - ./server/database:/app/server/database
      - ./server/uploads:/app/server/uploads
      - ./server/runtime:/app/server/runtime
      # 自愈用的 docker 套接字（仅 restart warp 一个容器）
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # 场馆出站走 WARP 链路（绕主服务器 IP 的风控封禁）；置空则直连
      - GYM_PROXY_URL=${GYM_PROXY_URL:-http://warp-gost:8080}
      # 风控自愈：全失败轮自动重启 warp 换出口 IP（最小间隔 10 分钟）
      - GYM_PROXY_ROTATE_CMD=${GYM_PROXY_ROTATE_CMD:-docker restart badminton-warp}
      - GYM_PROXY_ROTATE_MIN_INTERVAL_MS=${GYM_PROXY_ROTATE_MIN_INTERVAL_MS:-600000}
    volumes:
      # 自愈用的 docker 套接字（仅 restart warp 一个容器）
      - /var/run/docker.sock:/var/run/docker.sock

  # Cloudflare WARP：给订场请求提供与主服务器不同的免费出口 IP
  warp:
    image: caomingjun/warp:latest
    container_name: badminton-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.conf.all.src_valid_mark=1

  # gost：把 WARP 的 socks5 转成 http 代理（undici ProxyAgent 只认 http 代理）
  warp-gost:
    image: ginuerzh/gost
    container_name: badminton-warp-gost
    restart: unless-stopped
    command: -L http://:8080 -F socks5://warp:1080
    ports:
      - "127.0.0.1:1081:8080"   # 宿主机可用于手动诊断（curl -x http://127.0.0.1:1081 …）
