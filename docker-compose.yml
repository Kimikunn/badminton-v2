version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badminton
    restart: unless-stopped
    env_file:
      - server/.env
    ports:
      - "8088:3000"
    volumes:
      - ./server/database:/app/server/database
      - ./server/uploads:/app/server/uploads
      - ./server/runtime:/app/server/runtime
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
